name: Build Windows .exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pynput pyinstaller

      - name: Build Webcam.exe
        run: pyinstaller --onefile --windowed --uac-admin --name Webcam --icon=icon.ico --add-data "lagswitch.py;." --add-data "icon.ico;." --collect-all pynput --hidden-import json --hidden-import hashlib --hidden-import threading --hidden-import subprocess --hidden-import tkinter --hidden-import tkinter.font --hidden-import ctypes --hidden-import ctypes.wintypes --hidden-import winsound --hidden-import io --hidden-import math --hidden-import struct --hidden-import wave --hidden-import urllib.request --hidden-import getpass --hidden-import platform --hidden-import socket launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Webcam-Windows
          path: dist/Webcam.exe
